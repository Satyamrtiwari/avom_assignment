services:
  # FastAPI Backend Service
  - type: web
    name: resumeranker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt && python -m spacy download en_core_web_sm && python -c 'from fastembed import TextEmbedding; list(TextEmbedding(\"sentence-transformers/all-MiniLM-L6-v2\").embed([\"warmup\"]))'"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
